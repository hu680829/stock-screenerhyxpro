name: Multi-factor screener
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run screener
        run: python quant_engine.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: quant-rankings
          path: reports/quant_rankings.csv
          if-no-files-found: error
